<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spell Quest — The Keeper's Trial</title>
  <meta name="description" content="A magical spelling practice game. Hear the word, inscribe the rune.">
  <meta name="theme-color" content="#1b1033">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

  <!-- React & deps -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'title': ['Cinzel', 'serif'],
            'body': ['"Cormorant Garamond"', 'serif'],
            'scribe': ['Caveat', 'cursive'],
          },
          colors: {
            ink: {
              DEFAULT: '#1e1a2e',
              deep: '#120b20',
              dark: '#241a3a',
            },
            parchment: {
              DEFAULT: '#f1e2b8',
              deep:    '#d9c68d',
              dark:    '#a58a4a',
            },
            rune: {
              gold: '#e8b65a',
              glow: '#ffd784',
              ember: '#c46a1f',
              crimson: '#7a1f27',
            },
          },
          animation: {
            'candle-flicker': 'candleFlicker 3s ease-in-out infinite',
            'glow-pulse': 'glowPulse 2s ease-in-out infinite',
            'scroll-unfurl': 'scrollUnfurl 1.2s cubic-bezier(.2,.9,.3,1) forwards',
            'rune-pop': 'runePop 500ms cubic-bezier(.2,1.2,.4,1) forwards',
            'rune-fly': 'runeFly 900ms cubic-bezier(.4,.1,.3,1) forwards',
            'ink-fade': 'inkFade 900ms ease-out forwards',
            'shake-soft': 'shakeSoft 320ms ease-in-out both',
            'slide-up': 'slideUp 450ms cubic-bezier(.2,.9,.3,1) forwards',
            'stamp': 'stampIn 550ms cubic-bezier(.2,1.4,.4,1) forwards',
          },
        }
      }
    }
  </script>

  <!-- Lumina Core (hub integration) -->
  <script src="../shared/lumina-core.js"></script>

  <!-- Service worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="./styles/game-base.css">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
  </script>

  <script type="text/babel" src="./scripts/game-config.js"></script>
  <script type="text/babel" src="./scripts/game-audio.js"></script>
  <script type="text/babel" src="./scripts/game-tts.js"></script>
  <script type="text/babel" src="./scripts/game-api.js"></script>
  <script type="text/babel" src="./scripts/game-canvas.js"></script>
  <script type="text/babel" src="./scripts/game-main.js"></script>
  <script type="text/babel" src="./scripts/game-init.js"></script>
</body>
</html>
